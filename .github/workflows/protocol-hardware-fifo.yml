name: Protocol Hardware FIFO Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt update && sudo apt install -y iverilog

      - name: Run FIFO testbench
        working-directory: protocol/hardware
        run: make fifo

      - name: Save waveform artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifo_waveform
          path: protocol/hardware/build/fifo_tb.vcd

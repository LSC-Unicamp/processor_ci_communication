site_name: ProcessorCI Communication
docs_dir: docs
site_author: Julio Nunes Avelar
site_description: Host communication tools and protocol support hardware for ProcessorCI
repo_name: processor_ci_communication
repo_url: https://github.com/LSC-Unicamp/processor_ci_communication
site_url: https://lsc-unicamp.github.io/processor_ci_communication/
copyright: Communication software MIT; hardware CERN-OHL-P; documentation CC BY-SA 4.0
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Protocol:
      - Instructions: protocol/instructions.md
      - Internal: protocol/internal.md
      - Hardware: protocol/hardware.md
      - Boards: protocol/boards.md
theme:
  name: material
  logo: img/logo.svg
  highlightjs: true
  features:
    - toc.integrate
    - navigation.tabs
    - navigation.expand
    - navigation.instant.progress
    - content.code.copy
    - content.code.select
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search:
      lang:
        - en
        - pt
  - i18n:
      languages:
        - locale: pt
          name: Português
          default: true
        - locale: en
          name: English
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LSC-Unicamp/processor_ci_communication
markdown_extensions:
  - attr_list
  - md_in_html
